<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="skyUit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="glassUit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="facadeUit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="250" fill="url(#skyUit)"/>
  <!-- Trees / Grass -->
  <path d="M0 200 Q100 195 200 200 T400 200 L400 250 L0 250 Z" fill="#15803d"/>
  <rect x="0" y="215" width="400" height="35" fill="#166534"/>
  <!-- Main High-rise Building (UIT E-building) -->
  <rect x="130" y="40" width="140" height="175" rx="4" fill="url(#facadeUit)" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Curved roof accent -->
  <path d="M120 40 Q200 20 280 40 L275 48 L125 48 Z" fill="#0284c7"/>
  <!-- Glass Center Grid -->
  <rect x="150" y="55" width="100" height="155" fill="url(#glassUit)"/>
  <!-- Windows Grid Horizontal -->
  <line x1="150" y1="75" x2="250" y2="75" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
  <line x1="150" y1="95" x2="250" y2="95" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
  <line x1="150" y1="115" x2="250" y2="115" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
  <line x1="150" y1="135" x2="250" y2="135" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
  <line x1="150" y1="155" x2="250" y2="155" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
  <line x1="150" y1="175" x2="250" y2="175" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
  <line x1="150" y1="195" x2="250" y2="195" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
  <!-- Windows Vertical Grid -->
  <line x1="175" y1="55" x2="175" y2="210" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
  <line x1="200" y1="55" x2="200" y2="210" stroke="#7dd3fc" stroke-width="2" opacity="0.9"/>
  <line x1="225" y1="55" x2="225" y2="210" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
  <!-- Side wings -->
  <rect x="70" y="95" width="60" height="115" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="270" y="95" width="60" height="115" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Side wings windows -->
  <g fill="#0284c7" opacity="0.6">
    <rect x="80" y="110" width="18" height="12"/>
    <rect x="104" y="110" width="18" height="12"/>
    <rect x="80" y="130" width="18" height="12"/>
    <rect x="104" y="130" width="18" height="12"/>
    <rect x="80" y="150" width="18" height="12"/>
    <rect x="104" y="150" width="18" height="12"/>
    <rect x="80" y="170" width="18" height="12"/>
    <rect x="104" y="170" width="18" height="12"/>
    <rect x="278" y="110" width="18" height="12"/>
    <rect x="302" y="110" width="18" height="12"/>
    <rect x="278" y="130" width="18" height="12"/>
    <rect x="302" y="130" width="18" height="12"/>
    <rect x="278" y="150" width="18" height="12"/>
    <rect x="302" y="150" width="18" height="12"/>
    <rect x="278" y="170" width="18" height="12"/>
    <rect x="302" y="170" width="18" height="12"/>
  </g>
  <!-- Flag on top -->
  <line x1="200" y1="20" x2="200" y2="40" stroke="#475569" stroke-width="2"/>
  <polygon points="200,20 218,26 200,32" fill="#ef4444"/>
  <!-- Logo UIT badge -->
  <rect x="175" y="47" width="50" height="14" rx="3" fill="#ffffff" opacity="0.9"/>
  <text x="200" y="58" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#0369a1" text-anchor="middle">UIT - ĐHQG</text>
  <!-- Trees foreground -->
  <circle cx="50" cy="210" r="22" fill="#22c55e" opacity="0.9"/>
  <circle cx="350" cy="210" r="24" fill="#16a34a" opacity="0.9"/>
  <circle cx="110" cy="215" r="16" fill="#15803d" opacity="0.8"/>
  <circle cx="290" cy="215" r="17" fill="#15803d" opacity="0.8"/>
</svg>
