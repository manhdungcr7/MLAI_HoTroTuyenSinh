<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="skyPtit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="70%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="brickPtit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="60%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="250" fill="url(#skyPtit)"/>
  <!-- Ground -->
  <rect x="0" y="210" width="400" height="40" fill="#15803d"/>
  <rect x="0" y="225" width="400" height="25" fill="#334155"/>
  <!-- Central Red Brick Building (PTIT) -->
  <rect x="120" y="70" width="160" height="140" fill="url(#brickPtit)" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Classical Roof Pediment -->
  <polygon points="100,70 200,28 300,70" fill="#991b1b" stroke="#7f1d1d" stroke-width="2"/>
  <polygon points="120,68 200,34 280,68" fill="#fef2f2"/>
  <text x="200" y="58" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#b91c1c" text-anchor="middle">HỌC VIỆN PTIT</text>
  <!-- Central Columns -->
  <g fill="#f8fafc">
    <rect x="150" y="80" width="12" height="130"/>
    <rect x="180" y="80" width="12" height="130"/>
    <rect x="208" y="80" width="12" height="130"/>
    <rect x="238" y="80" width="12" height="130"/>
  </g>
  <!-- Side wings -->
  <rect x="40" y="105" width="80" height="105" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="280" y="105" width="80" height="105" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5"/>
  <!-- Windows -->
  <g fill="#fef08a" opacity="0.85">
    <rect x="55" y="120" width="18" height="22" rx="2"/>
    <rect x="85" y="120" width="18" height="22" rx="2"/>
    <rect x="55" y="155" width="18" height="22" rx="2"/>
    <rect x="85" y="155" width="18" height="22" rx="2"/>
    <rect x="295" y="120" width="18" height="22" rx="2"/>
    <rect x="325" y="120" width="18" height="22" rx="2"/>
    <rect x="295" y="155" width="18" height="22" rx="2"/>
    <rect x="325" y="155" width="18" height="22" rx="2"/>
  </g>
  <!-- Entrance -->
  <path d="M185 180 Q200 170 215 180 L215 210 L185 210 Z" fill="#450a0a"/>
  <!-- Flag on top -->
  <line x1="200" y1="12" x2="200" y2="28" stroke="#334155" stroke-width="2"/>
  <polygon points="200,12 220,18 200,24" fill="#ef4444"/>
  <!-- Star on Flag -->
  <polygon points="208,18 206,15 209,16 211,14 210,17 213,18 210,19 211,22 209,20 206,21" fill="#facc15"/>
  <!-- Trees -->
  <circle cx="30" cy="210" r="26" fill="#16a34a"/>
  <circle cx="370" cy="210" r="26" fill="#16a34a"/>
  <circle cx="95" cy="215" r="16" fill="#15803d"/>
  <circle cx="305" cy="215" r="16" fill="#15803d"/>
</svg>
