<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="skyHcmus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="65%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="glassHcmus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="250" fill="url(#skyHcmus)"/>
  <!-- Ground -->
  <rect x="0" y="210" width="400" height="40" fill="#15803d"/>
  <rect x="0" y="225" width="400" height="25" fill="#475569"/>
  <!-- Modern Science Tower (HCMUS C-Building) -->
  <rect x="110" y="35" width="180" height="175" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <!-- Top decorative overhang -->
  <rect x="95" y="30" width="210" height="15" rx="3" fill="#0f172a"/>
  <!-- Glass Curtain Wall -->
  <rect x="135" y="55" width="130" height="150" fill="url(#glassHcmus)"/>
  <!-- Sunshades / vertical mullions -->
  <line x1="160" y1="55" x2="160" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="185" y1="55" x2="185" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="200" y1="55" x2="200" y2="205" stroke="#38bdf8" stroke-width="2.5" opacity="0.9"/>
  <line x1="215" y1="55" x2="215" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <line x1="240" y1="55" x2="240" y2="205" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <!-- Horizontal floor slabs -->
  <line x1="135" y1="80" x2="265" y2="80" stroke="#bae6fd" stroke-width="2" opacity="0.7"/>
  <line x1="135" y1="105" x2="265" y2="105" stroke="#bae6fd" stroke-width="2" opacity="0.7"/>
  <line x1="135" y1="130" x2="265" y2="130" stroke="#bae6fd" stroke-width="2" opacity="0.7"/>
  <line x1="135" y1="155" x2="265" y2="155" stroke="#bae6fd" stroke-width="2" opacity="0.7"/>
  <line x1="135" y1="180" x2="265" y2="180" stroke="#bae6fd" stroke-width="2" opacity="0.7"/>
  <!-- Left Wing -->
  <rect x="40" y="85" width="70" height="125" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <g fill="#0284c7" opacity="0.6">
    <rect x="50" y="100" width="22" height="14"/>
    <rect x="80" y="100" width="22" height="14"/>
    <rect x="50" y="125" width="22" height="14"/>
    <rect x="80" y="125" width="22" height="14"/>
    <rect x="50" y="150" width="22" height="14"/>
    <rect x="80" y="150" width="22" height="14"/>
    <rect x="50" y="175" width="22" height="14"/>
    <rect x="80" y="175" width="22" height="14"/>
  </g>
  <!-- Right Wing -->
  <rect x="290" y="85" width="70" height="125" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <g fill="#0284c7" opacity="0.6">
    <rect x="300" y="100" width="22" height="14"/>
    <rect x="330" y="100" width="22" height="14"/>
    <rect x="300" y="125" width="22" height="14"/>
    <rect x="330" y="125" width="22" height="14"/>
    <rect x="300" y="150" width="22" height="14"/>
    <rect x="330" y="150" width="22" height="14"/>
    <rect x="300" y="175" width="22" height="14"/>
    <rect x="330" y="175" width="22" height="14"/>
  </g>
  <!-- Logo HCMUS text badge -->
  <rect x="155" y="12" width="90" height="16" rx="4" fill="#ffffff"/>
  <text x="200" y="24" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#0284c7" text-anchor="middle">KHTN - ĐHQG HCM</text>
  <!-- Lush Greenery -->
  <circle cx="35" cy="210" r="28" fill="#16a34a"/>
  <circle cx="365" cy="210" r="28" fill="#16a34a"/>
  <circle cx="95" cy="215" r="18" fill="#15803d"/>
  <circle cx="305" cy="215" r="18" fill="#15803d"/>
</svg>
