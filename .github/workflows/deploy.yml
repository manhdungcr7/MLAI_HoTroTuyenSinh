name: CI/CD Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    name: Kiểm tra & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài đặt dependencies
        run: npm ci

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Cổng kiểm tra đồng nhất
        run: npm run kiem-tra

      - name: Chạy Unit Test
        run: npm test

      - name: Build ứng dụng
        run: npm run build

      - name: Build CMS quản trị
        run: npm run cms:build

      - name: Deploy lên Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '5fdd1d1433519df6429d7418d43fff9a' }}
          command: pages deploy dist --project-name=nguyenvongai --branch=main

      # CMS quản trị (tình nguyện viên nhập dữ liệu) là một project Pages riêng. Chỉ deploy khi đã tạo project `nguyenvongai-cms`,
      # gắn D1/KV và Cloudflare Access (xem docs/QUAN-TRI.md), rồi đặt biến Repository variable DEPLOY_CMS = true.
      - name: Deploy CMS lên Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_CMS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '5fdd1d1433519df6429d7418d43fff9a' }}
          workingDirectory: cms
          command: pages deploy dist --project-name=nguyenvongai-cms --branch=main
